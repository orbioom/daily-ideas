name: Pace
options:
  bundleIdPrefix: com.orbioom
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.orbioom.pace
targets:
  Pace:
    type: application
    platform: iOS
    sources:
      - path: Pace
    info:
      path: Pace/Info.plist
      properties:
        CFBundleDisplayName: Pace
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: PaceDark
        NSLocationWhenInUseUsageDescription: "Pace uses your location to track your run route and calculate distance."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Pace uses your location in the background to continuously track your route while you run."
        UIBackgroundModes:
          - location
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UIUserInterfaceStyle: Automatic
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
