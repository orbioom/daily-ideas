<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decay Notes — Orbioom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --glass: rgba(255,255,255,0.42);
  --glass-raised: rgba(255,255,255,0.78);
  --border: rgba(255,255,255,0.7);
  --edge: rgba(38,40,70,0.1);
  --text: #1b1d2a;
  --text-2: #565a70;
  --text-3: #8b8fa3;
  --accent-grad: linear-gradient(180deg, #3a3e4c 0%, #23262f 100%);
  --dot-live: #86c79a;
  --blur: 22px;
  --ease: cubic-bezier(0.16,1,0.3,1);
  --radius: 16px;
  --maxw: 720px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Manrope', sans-serif;
  background: linear-gradient(155deg, #EDEEF3 0%, #E7E9F0 55%, #ECEEF2 100%);
  min-height: 100vh;
  color: var(--text);
}
header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 32px; height: 58px;
  background: var(--glass-raised);
  backdrop-filter: blur(30px) saturate(180%);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  border-bottom: 1px solid var(--border);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
}
.logo { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; color: var(--text); }
.logo-sub {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  color: var(--text-3); font-weight: 400; margin-left: 10px; letter-spacing: 0.06em;
}
.count-badge {
  font-family: 'JetBrains Mono', monospace; font-size: 11px;
  color: var(--text-3); letter-spacing: 0.05em;
}
main { max-width: var(--maxw); margin: 0 auto; padding: 90px 24px 80px; }

.compose {
  background: var(--glass);
  backdrop-filter: blur(var(--blur)) saturate(180%);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(180%);
  border: 1px solid var(--border);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.65), 0 4px 28px rgba(40,44,80,0.08);
  border-radius: var(--radius); padding: 22px 24px; margin-bottom: 36px;
}
.compose textarea {
  width: 100%; border: none; background: transparent;
  font-family: 'Manrope', sans-serif; font-size: 15px;
  color: var(--text); resize: none; outline: none; min-height: 76px; line-height: 1.65;
}
.compose textarea::placeholder { color: var(--text-3); }
.compose-footer {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 14px; padding-top: 14px;
  border-top: 1px solid rgba(255,255,255,0.55);
}
.decay-selector { display: flex; align-items: center; gap: 8px; }
.decay-selector label {
  font-size: 11px; color: var(--text-3);
  font-family: 'JetBrains Mono', monospace; letter-spacing: 0.05em;
}
.decay-selector select {
  font-family: 'JetBrains Mono', monospace; font-size: 11px;
  background: rgba(255,255,255,0.55); border: 1px solid var(--border);
  border-radius: 8px; padding: 5px 10px; color: var(--text-2);
  outline: none; cursor: pointer;
}
.btn-primary {
  background: var(--accent-grad); color: white; border: none;
  border-radius: 12px; padding: 9px 22px;
  font-family: 'Manrope', sans-serif; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: transform 0.15s var(--ease), box-shadow 0.15s var(--ease);
  letter-spacing: -0.01em;
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 5px 20px rgba(35,38,47,0.28); }

.section-eyebrow {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--text-3); margin-bottom: 16px;
}
.notes-stack { display: flex; flex-direction: column; gap: 10px; }

.note-card {
  background: var(--glass);
  backdrop-filter: blur(var(--blur)) saturate(180%);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(180%);
  border: 1px solid var(--border);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.6), 0 2px 10px rgba(40,44,80,0.05);
  border-radius: var(--radius); padding: 18px 22px;
  position: relative; transition: transform 0.2s var(--ease);
}
.note-card:hover { transform: translateY(-1px); }
.note-text {
  font-size: 15px; line-height: 1.65; margin-bottom: 14px;
  white-space: pre-wrap; word-break: break-word;
}
.note-meta {
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;
}
.note-age {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  letter-spacing: 0.05em; color: var(--text-3);
}
.note-bar-wrap {
  width: 100%; height: 2px;
  background: rgba(139,143,163,0.12); border-radius: 2px;
  margin-bottom: 14px; overflow: hidden;
}
.note-bar {
  height: 100%; border-radius: 2px;
  background: linear-gradient(90deg, var(--dot-live), rgba(134,199,154,0.4));
  transition: width 0.6s var(--ease);
}
.note-actions { display: flex; gap: 6px; }
.btn-ghost {
  background: transparent; border: 1px solid rgba(255,255,255,0.55);
  border-radius: 8px; padding: 4px 11px;
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  letter-spacing: 0.04em; color: var(--text-3);
  cursor: pointer; transition: all 0.15s var(--ease);
}
.btn-ghost:hover { background: rgba(255,255,255,0.45); color: var(--text-2); }
.fading-chip {
  position: absolute; top: 14px; right: 14px;
  font-family: 'JetBrains Mono', monospace; font-size: 9px;
  letter-spacing: 0.1em; color: var(--dot-live);
  opacity: 0.75; text-transform: uppercase;
}
.empty-state {
  text-align: center; padding: 72px 0; color: var(--text-3);
  font-size: 14px; line-height: 1.7;
}
.empty-orb {
  width: 48px; height: 48px; border-radius: 50%;
  background: radial-gradient(circle at 38% 34%, rgba(255,255,255,0.85) 0%, rgba(200,202,218,0.45) 60%, rgba(160,163,188,0.2) 100%);
  margin: 0 auto 18px; opacity: 0.5;
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>
<header>
  <div class="logo">Orbioom <span class="logo-sub">DECAY NOTES</span></div>
  <span class="count-badge" id="countBadge">—</span>
</header>

<main>
  <div class="compose">
    <textarea id="noteInput" placeholder="Write something worth remembering. It will begin to fade." rows="3"></textarea>
    <div class="compose-footer">
      <div class="decay-selector">
        <label>fades in</label>
        <select id="decaySelect">
          <option value="1">1 day</option>
          <option value="3">3 days</option>
          <option value="7" selected>7 days</option>
          <option value="14">14 days</option>
          <option value="30">30 days</option>
          <option value="90">90 days</option>
        </select>
      </div>
      <button class="btn-primary" id="plantBtn">Plant note</button>
    </div>
  </div>

  <div class="section-eyebrow" id="eyebrow" style="display:none">living notes</div>
  <div class="notes-stack" id="notesGrid"></div>
</main>

<script>
const KEY = 'orbioom:decay-notes-v1';
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } };
const save = n => localStorage.setItem(KEY, JSON.stringify(n));

function vitality(note) {
  const ageDays = (Date.now() - note.created) / 86400000;
  return Math.max(0, 1 - ageDays / note.decayDays);
}

function ageStr(ts) {
  const ms = Date.now() - ts;
  const m = Math.floor(ms / 60000), h = Math.floor(ms / 3600000), d = Math.floor(ms / 86400000);
  if (m < 1) return 'just now';
  if (m < 60) return `${m}m ago`;
  if (h < 24) return `${h}h ago`;
  return `${d}d ago`;
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function addNote() {
  const text = document.getElementById('noteInput').value.trim();
  if (!text) return;
  const decay = parseInt(document.getElementById('decaySelect').value);
  const notes = load();
  notes.unshift({ id: Date.now(), text, created: Date.now(), decayDays: decay });
  save(notes);
  document.getElementById('noteInput').value = '';
  render();
}

function refresh(id) {
  const notes = load();
  const n = notes.find(x => x.id === id);
  if (n) { n.created = Date.now(); save(notes); render(); }
}

function remove(id) {
  save(load().filter(x => x.id !== id));
  render();
}

function render() {
  const notes = load();
  const grid = document.getElementById('notesGrid');
  const badge = document.getElementById('countBadge');
  const eyebrow = document.getElementById('eyebrow');

  const alive = notes.filter(n => vitality(n) > 0.05);
  const fading = notes.filter(n => vitality(n) <= 0.3 && vitality(n) > 0.05);
  badge.textContent = `${notes.length} note${notes.length !== 1 ? 's' : ''}`;

  if (notes.length === 0) {
    eyebrow.style.display = 'none';
    grid.innerHTML = `<div class="empty-state"><div class="empty-orb"></div><p>Nothing planted yet.</p><p style="margin-top:6px;font-size:13px">Write something. Watch it breathe.</p></div>`;
    return;
  }

  eyebrow.style.display = 'block';
  eyebrow.textContent = `${alive.length} living · ${fading.length} fading · ${notes.length - alive.length} nearly gone`;

  grid.innerHTML = notes.map(note => {
    const v = vitality(note);
    const pct = Math.round(v * 100);
    const op = Math.max(0.1, v * 0.9 + 0.1);
    const isFading = v < 0.35;
    return `<div class="note-card" style="opacity:${op.toFixed(2)}">
      ${isFading ? '<span class="fading-chip">fading</span>' : ''}
      <div class="note-text" style="color:rgba(27,29,42,${Math.max(0.45,op).toFixed(2)})">${esc(note.text)}</div>
      <div class="note-bar-wrap"><div class="note-bar" style="width:${pct}%"></div></div>
      <div class="note-meta">
        <span class="note-age">${ageStr(note.created)} · ${pct}% · ${note.decayDays}d decay</span>
        <div class="note-actions">
          <button class="btn-ghost" onclick="refresh(${note.id})">refresh</button>
          <button class="btn-ghost" onclick="remove(${note.id})">remove</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

document.getElementById('plantBtn').addEventListener('click', addNote);
document.getElementById('noteInput').addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') addNote();
});

setInterval(render, 60000);
render();
</script>
</body>
</html>
