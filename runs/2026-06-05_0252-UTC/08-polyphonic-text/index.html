<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polyphonic Text — Orbioom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --glass: rgba(255,255,255,0.42);
  --glass-raised: rgba(255,255,255,0.78);
  --border: rgba(255,255,255,0.7);
  --text: #1b1d2a;
  --text-2: #565a70;
  --text-3: #8b8fa3;
  --accent-grad: linear-gradient(180deg, #3a3e4c 0%, #23262f 100%);
  --dot-live: #86c79a;
  --blur: 22px;
  --ease: cubic-bezier(0.16,1,0.3,1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Manrope', sans-serif;
  background: linear-gradient(155deg, #EDEEF3 0%, #E7E9F0 50%, #ECEEF2 100%);
  color: var(--text); min-height: 100vh;
  display: flex; flex-direction: column;
  overflow: hidden;
}
.top-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 28px;
  background: var(--glass-raised);
  backdrop-filter: blur(30px) saturate(180%);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  border-bottom: 1px solid var(--border);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
  flex-shrink: 0;
}
.logo { font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
.logo-sub {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  color: var(--text-3); margin-left: 10px; font-weight: 400; letter-spacing: 0.06em;
}
.playback {
  display: flex; align-items: center; gap: 10px;
}
.btn-primary {
  background: var(--accent-grad); color: white; border: none;
  border-radius: 12px; padding: 8px 20px;
  font-family: 'Manrope', sans-serif; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: transform 0.15s var(--ease), box-shadow 0.15s var(--ease);
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(35,38,47,0.25); }
.btn-primary:disabled { opacity: 0.4; cursor: default; transform: none; box-shadow: none; }
.btn-ghost {
  background: rgba(255,255,255,0.4); border: 1px solid var(--border);
  border-radius: 10px; padding: 7px 14px;
  font-family: 'JetBrains Mono', monospace; font-size: 11px;
  letter-spacing: 0.04em; color: var(--text-3);
  cursor: pointer; transition: all 0.15s var(--ease);
}
.btn-ghost:hover { background: rgba(255,255,255,0.65); color: var(--text-2); }

.live-indicator {
  display: flex; align-items: center; gap: 7px;
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  letter-spacing: 0.06em; color: var(--text-3);
}
.live-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--dot-live); box-shadow: 0 0 5px var(--dot-live);
  opacity: 0; transition: opacity 0.2s;
}
.live-dot.on { opacity: 1; }

.main-area {
  flex: 1; display: flex; overflow: hidden;
}

/* Score canvas */
.score-area {
  flex: 1; overflow-y: auto; padding: 28px 28px 100px;
  position: relative;
}

/* Input panel - right sidebar */
.sidebar {
  width: 300px; flex-shrink: 0;
  background: var(--glass-raised);
  backdrop-filter: blur(var(--blur)) saturate(180%);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(180%);
  border-left: 1px solid var(--border);
  box-shadow: inset 1px 0 0 rgba(255,255,255,0.7);
  display: flex; flex-direction: column; padding: 24px 20px; gap: 16px;
  overflow-y: auto;
}
.sidebar-label {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-3);
  margin-bottom: 4px;
}
.sidebar textarea {
  width: 100%; background: rgba(255,255,255,0.5);
  border: 1px solid var(--border); border-radius: 12px;
  padding: 14px; font-family: 'Manrope', sans-serif; font-size: 13px;
  color: var(--text); resize: none; outline: none; line-height: 1.6;
  min-height: 200px;
}
.sidebar textarea::placeholder { color: var(--text-3); }

.legend { display: flex; flex-direction: column; gap: 8px; }
.legend-item {
  display: flex; align-items: center; gap: 8px;
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  letter-spacing: 0.04em; color: var(--text-3);
}
.legend-swatch {
  width: 24px; height: 8px; border-radius: 3px; flex-shrink: 0;
}

/* Score rendering */
.score-sentence {
  margin-bottom: 24px; position: relative;
}
.sentence-label {
  font-family: 'JetBrains Mono', monospace; font-size: 9px;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-3);
  margin-bottom: 6px;
}
.score-canvas-wrap {
  background: var(--glass);
  backdrop-filter: blur(var(--blur)) saturate(180%);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(180%);
  border: 1px solid var(--border);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.6), 0 2px 8px rgba(40,44,80,0.05);
  border-radius: 12px; padding: 14px 16px; overflow: hidden;
}
canvas.score-canvas { display: block; width: 100%; height: 64px; }

.score-text-preview {
  font-size: 12px; color: var(--text-3); margin-top: 8px;
  line-height: 1.5; font-style: italic;
}

.playing-highlight { box-shadow: 0 0 0 2px rgba(134,199,154,0.4), 0 4px 20px rgba(134,199,154,0.12); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<div class="top-bar">
  <div class="logo">Orbioom <span class="logo-sub">POLYPHONIC TEXT</span></div>
  <div class="playback">
    <div class="live-indicator">
      <div class="live-dot" id="liveDot"></div>
      <span id="playStatus">ready</span>
    </div>
    <button class="btn-ghost" id="stopBtn" onclick="stopAudio()" style="display:none">stop</button>
    <button class="btn-primary" id="playBtn" onclick="playScore()" disabled>play text</button>
  </div>
</div>

<div class="main-area">
  <div class="score-area" id="scoreArea">
    <div style="text-align:center;padding:60px 0;color:var(--text-3)">
      <div style="font-size:32px;margin-bottom:12px;opacity:0.3">♩</div>
      <div style="font-size:14px;line-height:1.7">Paste text in the sidebar.<br>Each sentence becomes a musical phrase.</div>
    </div>
  </div>

  <div class="sidebar">
    <div>
      <div class="sidebar-label">text</div>
      <textarea id="textInput" placeholder="Paste any prose here. Short sentences become quick notes; long sentences become extended phrases. Punctuation creates rests." rows="8"></textarea>
    </div>
    <button class="btn-primary" onclick="renderScore()">Render score</button>

    <div>
      <div class="sidebar-label" style="margin-bottom:10px">legend</div>
      <div class="legend">
        <div class="legend-item">
          <div class="legend-swatch" style="background:rgba(27,29,42,0.8)"></div>
          word — height = word length
        </div>
        <div class="legend-item">
          <div class="legend-swatch" style="background:rgba(139,143,163,0.4)"></div>
          punctuation rest
        </div>
        <div class="legend-item">
          <div class="legend-swatch" style="background:rgba(134,199,154,0.7)"></div>
          question / rising
        </div>
        <div class="legend-item">
          <div class="legend-swatch" style="background:rgba(255,200,80,0.7)"></div>
          exclamation / accent
        </div>
      </div>
    </div>

    <div style="margin-top:auto">
      <div class="sidebar-label">sample</div>
      <button class="btn-ghost" style="width:100%" onclick="loadSample()">load sample text</button>
    </div>
  </div>
</div>

<script>
const SAMPLE = `The sky above the port was the color of television, tuned to a dead channel. It was a bright cold day in April, and the clocks were striking thirteen. Many years later, as he faced the firing squad, Colonel Aureliano Buendía was to remember that distant afternoon when his father took him to discover ice. Call me Ishmael. It was the best of times, it was the worst of times, it was the age of wisdom, it was the age of foolishness, it was the epoch of belief, it was the epoch of incredulity.`;

let scoreData = [];
let audioCtx = null;
let playScheduled = [];

function parseSentences(text) {
  return text.trim().split(/(?<=[.!?,;:])\s+/).filter(s => s.trim().length > 3);
}

function analyzeWord(w) {
  const clean = w.replace(/[^a-zA-Z']/g, '');
  return { raw: w, text: clean, len: clean.length, hasPunct: /[,.;:!?]/.test(w) };
}

function sentenceType(s) {
  if (/\?/.test(s)) return 'question';
  if (/!/.test(s)) return 'exclaim';
  return 'statement';
}

function renderScore() {
  const text = document.getElementById('textInput').value.trim();
  if (!text) return;
  const sentences = parseSentences(text);
  scoreData = sentences.map((s, i) => ({
    sentence: s,
    type: sentenceType(s),
    words: s.split(/\s+/).filter(w => w.trim()).map(analyzeWord),
    index: i
  }));
  drawAllSentences();
  document.getElementById('playBtn').disabled = false;
}

function drawAllSentences() {
  const area = document.getElementById('scoreArea');
  area.innerHTML = '';
  scoreData.forEach((data, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'score-sentence';
    wrap.id = `sentence-${i}`;

    const label = document.createElement('div');
    label.className = 'sentence-label';
    label.textContent = `sentence ${i + 1} · ${data.words.length} words · ${data.type}`;

    const canvasWrap = document.createElement('div');
    canvasWrap.className = 'score-canvas-wrap';
    canvasWrap.id = `canvas-wrap-${i}`;

    const cvs = document.createElement('canvas');
    cvs.className = 'score-canvas';
    cvs.id = `canvas-${i}`;
    canvasWrap.appendChild(cvs);

    const preview = document.createElement('div');
    preview.className = 'score-text-preview';
    preview.textContent = data.sentence.length > 100 ? data.sentence.slice(0, 97) + '…' : data.sentence;

    wrap.appendChild(label);
    wrap.appendChild(canvasWrap);
    wrap.appendChild(preview);
    area.appendChild(wrap);

    drawSentenceCanvas(cvs, data);
  });
}

function drawSentenceCanvas(cvs, data, playheadWord) {
  const parent = cvs.parentElement;
  const W = parent.offsetWidth - 32;
  cvs.width = W;
  cvs.height = 64;
  const ctx = cvs.getContext('2d');
  ctx.clearRect(0, 0, W, 64);

  const { words, type } = data;
  if (!words.length) return;

  // Staff lines (subtle)
  ctx.strokeStyle = 'rgba(139,143,163,0.12)';
  ctx.lineWidth = 0.5;
  for (let l = 0; l < 5; l++) {
    const y = 8 + l * 11;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  // Calculate total duration (word count) for layout
  const totalBeats = words.reduce((a, w) => a + Math.max(1, w.len * 0.4), 0);
  let xPos = 8;

  words.forEach((w, wi) => {
    const beatLen = Math.max(1, w.len * 0.4);
    const noteW = Math.max(4, (beatLen / totalBeats) * (W - 16));

    // Pitch: word length maps to vertical position (longer words = higher pitch)
    const normLen = Math.min(1, (w.len - 1) / 11);
    const noteY = 48 - normLen * 36;

    let noteColor;
    if (type === 'question' && wi === words.length - 1) {
      noteColor = 'rgba(134,199,154,0.85)';
    } else if (type === 'exclaim') {
      noteColor = wi % 3 === 0 ? 'rgba(255,200,80,0.8)' : 'rgba(27,29,42,0.7)';
    } else {
      const brightness = 0.5 + 0.35 * normLen;
      noteColor = `rgba(27,29,42,${brightness.toFixed(2)})`;
    }

    // Note body
    const isPlaying = playheadWord === wi;
    if (isPlaying) {
      ctx.shadowColor = 'rgba(134,199,154,0.6)';
      ctx.shadowBlur = 8;
    }
    ctx.fillStyle = isPlaying ? 'rgba(134,199,154,0.9)' : noteColor;
    const rr = Math.min(4, noteW * 0.3);
    roundRect(ctx, xPos, noteY, noteW * 0.78, 8, rr);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Rest tick for punctuation
    if (w.hasPunct) {
      ctx.strokeStyle = 'rgba(139,143,163,0.35)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(xPos + noteW * 0.78 + 1, 12);
      ctx.lineTo(xPos + noteW * 0.78 + 1, 52);
      ctx.stroke();
    }

    xPos += noteW;
  });
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

// Audio playback
function playScore() {
  if (!scoreData.length) return;
  stopAudio();
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  document.getElementById('liveDot').classList.add('on');
  document.getElementById('playStatus').textContent = 'playing';
  document.getElementById('playBtn').disabled = true;
  document.getElementById('stopBtn').style.display = 'inline-block';

  let t = audioCtx.currentTime + 0.1;
  const BPM = 80;
  const beatSec = 60 / BPM;

  scoreData.forEach((data, si) => {
    const words = data.words;
    const scheduleEl = document.getElementById(`canvas-${si}`);

    words.forEach((w, wi) => {
      if (!w.len) return;
      const beatLen = Math.max(1, w.len * 0.4);
      const dur = beatLen * beatSec * 0.6;
      const restDur = beatLen * beatSec * 0.4;

      // Pitch: 200Hz to 800Hz based on word length
      const normLen = Math.min(1, (w.len - 1) / 11);
      const freq = 220 * Math.pow(2, normLen * 2);

      const noteStartTime = t;
      // Schedule audio
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = data.type === 'question' ? 'triangle' : 'sine';
      osc.frequency.setValueAtTime(freq, noteStartTime);
      if (data.type === 'question' && wi === words.length - 1) {
        osc.frequency.linearRampToValueAtTime(freq * 1.3, noteStartTime + dur);
      }
      gain.gain.setValueAtTime(0, noteStartTime);
      gain.gain.linearRampToValueAtTime(0.06, noteStartTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, noteStartTime + dur);
      osc.start(noteStartTime);
      osc.stop(noteStartTime + dur);

      // Visual playhead
      const delay = (noteStartTime - audioCtx.currentTime) * 1000;
      const id = setTimeout(() => {
        if (scheduleEl) drawSentenceCanvas(scheduleEl, data, wi);
        const wrap = document.getElementById(`canvas-wrap-${si}`);
        if (wrap) { wrap.classList.add('playing-highlight'); }
      }, delay);
      const clearId = setTimeout(() => {
        if (scheduleEl) drawSentenceCanvas(scheduleEl, data, null);
        const wrap = document.getElementById(`canvas-wrap-${si}`);
        if (wrap) { wrap.classList.remove('playing-highlight'); }
      }, delay + dur * 1000);

      playScheduled.push(id, clearId);
      t += (beatLen + (w.hasPunct ? 0.5 : 0)) * beatSec;
    });
    t += beatSec; // sentence gap
  });

  const totalDur = (t - (audioCtx.currentTime + 0.1)) * 1000;
  const endId = setTimeout(() => stopAudio(), totalDur + 200);
  playScheduled.push(endId);
}

function stopAudio() {
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
  playScheduled.forEach(id => clearTimeout(id));
  playScheduled = [];
  document.getElementById('liveDot').classList.remove('on');
  document.getElementById('playStatus').textContent = 'ready';
  document.getElementById('playBtn').disabled = !scoreData.length;
  document.getElementById('stopBtn').style.display = 'none';
  // Redraw all without highlight
  scoreData.forEach((data, i) => {
    const cvs = document.getElementById(`canvas-${i}`);
    if (cvs) drawSentenceCanvas(cvs, data, null);
    const wrap = document.getElementById(`canvas-wrap-${i}`);
    if (wrap) wrap.classList.remove('playing-highlight');
  });
}

function loadSample() {
  document.getElementById('textInput').value = SAMPLE;
  renderScore();
}

window.addEventListener('resize', () => {
  if (scoreData.length) drawAllSentences();
});
</script>
</body>
</html>
