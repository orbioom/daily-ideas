<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diffusion Canvas — Orbioom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --glass: rgba(255,255,255,0.42);
  --glass-dark: rgba(20,21,28,0.72);
  --border: rgba(255,255,255,0.7);
  --text: #1b1d2a;
  --text-2: #565a70;
  --text-3: #8b8fa3;
  --accent-grad: linear-gradient(180deg, #3a3e4c 0%, #23262f 100%);
  --dot-live: #86c79a;
  --blur: 22px;
  --ease: cubic-bezier(0.16,1,0.3,1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'Manrope', sans-serif;
  background: #0e0f14;
  color: white;
  display: flex; flex-direction: column; height: 100vh;
}

canvas#sim { display: none; }

canvas#display {
  flex: 1; width: 100%; cursor: crosshair;
  image-rendering: pixelated; image-rendering: crisp-edges;
}

.control-bar {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: var(--glass-dark);
  backdrop-filter: blur(28px) saturate(160%);
  -webkit-backdrop-filter: blur(28px) saturate(160%);
  border-top: 1px solid rgba(255,255,255,0.1);
  padding: 16px 24px 20px;
  display: flex; flex-direction: column; gap: 14px;
}

.preset-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.preset-label {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: rgba(255,255,255,0.3); margin-right: 4px;
}
.preset-chip {
  background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14);
  border-radius: 20px; padding: 6px 14px;
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  letter-spacing: 0.05em; color: rgba(255,255,255,0.4);
  cursor: pointer; transition: all 0.15s var(--ease); user-select: none;
}
.preset-chip.active {
  background: rgba(134,199,154,0.15); border-color: rgba(134,199,154,0.35);
  color: rgba(134,199,154,0.9);
}
.preset-chip:hover:not(.active) { background: rgba(255,255,255,0.15); color: rgba(255,255,255,0.7); }

.sliders-row {
  display: flex; gap: 24px; align-items: center; flex-wrap: wrap;
}
.slider-group { display: flex; align-items: center; gap: 10px; }
.slider-group label {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  letter-spacing: 0.07em; color: rgba(255,255,255,0.35); white-space: nowrap; min-width: 14px;
}
.slider-group input[type=range] {
  -webkit-appearance: none; appearance: none;
  width: 100px; height: 3px; border-radius: 2px;
  background: rgba(255,255,255,0.15); outline: none; cursor: pointer;
}
.slider-group input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%;
  background: rgba(134,199,154,0.9); cursor: pointer;
  box-shadow: 0 0 6px rgba(134,199,154,0.5);
}
.slider-val {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  color: rgba(255,255,255,0.3); min-width: 36px; text-align: right;
}

.actions-row {
  display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap;
}
.left-actions { display: flex; gap: 8px; align-items: center; }
.btn-primary {
  background: var(--accent-grad); color: white; border: none;
  border-radius: 12px; padding: 9px 20px;
  font-family: 'Manrope', sans-serif; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: transform 0.15s var(--ease), box-shadow 0.15s var(--ease);
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 5px 20px rgba(0,0,0,0.5); }
.btn-ghost {
  background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
  border-radius: 10px; padding: 8px 16px;
  font-family: 'JetBrains Mono', monospace; font-size: 11px;
  letter-spacing: 0.04em; color: rgba(255,255,255,0.4);
  cursor: pointer; transition: all 0.15s var(--ease);
}
.btn-ghost:hover { background: rgba(255,255,255,0.15); color: rgba(255,255,255,0.7); }

.info-right {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  color: rgba(255,255,255,0.2); letter-spacing: 0.05em; display: flex; align-items: center; gap: 6px;
}
.live-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--dot-live); box-shadow: 0 0 5px var(--dot-live);
}
.logo-mark {
  position: absolute; top: 16px; left: 20px; z-index: 10;
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: rgba(255,255,255,0.18);
}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>

<div class="logo-mark">Orbioom · Diffusion Canvas</div>
<canvas id="sim"></canvas>
<canvas id="display"></canvas>

<div class="control-bar">
  <div class="preset-row">
    <span class="preset-label">pattern</span>
    <div class="preset-chip active" onclick="applyPreset(this,'worms')" data-name="worms">worms</div>
    <div class="preset-chip" onclick="applyPreset(this,'spots')" data-name="spots">spots</div>
    <div class="preset-chip" onclick="applyPreset(this,'coral')" data-name="coral">coral</div>
    <div class="preset-chip" onclick="applyPreset(this,'cells')" data-name="cells">cells</div>
    <div class="preset-chip" onclick="applyPreset(this,'maze')" data-name="maze">maze</div>
    <div class="preset-chip" onclick="applyPreset(this,'chaos')" data-name="chaos">chaos</div>
  </div>

  <div class="sliders-row">
    <div class="slider-group">
      <label>f</label>
      <input type="range" id="sliderF" min="0.010" max="0.080" step="0.001" value="0.055">
      <span class="slider-val" id="valF">0.055</span>
    </div>
    <div class="slider-group">
      <label>k</label>
      <input type="range" id="sliderK" min="0.040" max="0.075" step="0.001" value="0.062">
      <span class="slider-val" id="valK">0.062</span>
    </div>
    <div class="slider-group">
      <label>Du</label>
      <input type="range" id="sliderDu" min="0.05" max="0.30" step="0.01" value="0.20">
      <span class="slider-val" id="valDu">0.20</span>
    </div>
    <div class="slider-group">
      <label>Dv</label>
      <input type="range" id="sliderDv" min="0.02" max="0.15" step="0.01" value="0.10">
      <span class="slider-val" id="valDv">0.10</span>
    </div>
  </div>

  <div class="actions-row">
    <div class="left-actions">
      <button class="btn-primary" id="toggleBtn" onclick="toggleSim()">pause</button>
      <button class="btn-ghost" onclick="resetSim()">reset</button>
      <button class="btn-ghost" onclick="saveImage()">save PNG</button>
    </div>
    <div class="info-right">
      <span class="live-dot" id="liveDot"></span>
      <span id="genCount">gen 0</span>
      <span>&nbsp;·&nbsp; click to seed</span>
    </div>
  </div>
</div>

<script>
// Gray-Scott reaction diffusion
const SIM_W = 256, SIM_H = 256;
const sim = document.getElementById('sim');
const display = document.getElementById('display');
const simCtx = sim.getContext('2d');
const dCtx = display.getContext('2d');
sim.width = SIM_W; sim.height = SIM_H;

let U = new Float32Array(SIM_W * SIM_H);
let V = new Float32Array(SIM_W * SIM_H);
let nU = new Float32Array(SIM_W * SIM_H);
let nV = new Float32Array(SIM_W * SIM_H);

let params = { f: 0.055, k: 0.062, Du: 0.20, Dv: 0.10 };
let running = true;
let gen = 0;
let animId = null;

const PRESETS = {
  worms: { f: 0.055, k: 0.062, Du: 0.20, Dv: 0.10 },
  spots: { f: 0.035, k: 0.065, Du: 0.16, Dv: 0.08 },
  coral: { f: 0.058, k: 0.065, Du: 0.19, Dv: 0.05 },
  cells: { f: 0.026, k: 0.051, Du: 0.16, Dv: 0.08 },
  maze:  { f: 0.029, k: 0.057, Du: 0.19, Dv: 0.05 },
  chaos: { f: 0.026, k: 0.061, Du: 0.16, Dv: 0.05 }
};

function idx(x, y) { return ((y + SIM_H) % SIM_H) * SIM_W + ((x + SIM_W) % SIM_W); }

function init() {
  for (let i = 0; i < SIM_W * SIM_H; i++) { U[i] = 1; V[i] = 0; }
  // Seed with a few random spots
  const seeds = 8 + Math.floor(Math.random() * 8);
  for (let s = 0; s < seeds; s++) {
    const cx = 20 + Math.floor(Math.random() * (SIM_W - 40));
    const cy = 20 + Math.floor(Math.random() * (SIM_H - 40));
    const r = 3 + Math.floor(Math.random() * 5);
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        if (dx*dx + dy*dy <= r*r) {
          const i = idx(cx + dx, cy + dy);
          U[i] = 0.5 + Math.random() * 0.1;
          V[i] = 0.25 + Math.random() * 0.1;
        }
      }
    }
  }
  gen = 0;
}

function step(n) {
  const { f, k, Du, Dv } = params;
  const W = SIM_W, H = SIM_H;
  for (let iter = 0; iter < n; iter++) {
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const i = y * W + x;
        const u = U[i], v = V[i];
        const lap_u = U[((y-1+H)%H)*W+x] + U[((y+1)%H)*W+x] + U[y*W+(x-1+W)%W] + U[y*W+(x+1)%W] - 4*u;
        const lap_v = V[((y-1+H)%H)*W+x] + V[((y+1)%H)*W+x] + V[y*W+(x-1+W)%W] + V[y*W+(x+1)%W] - 4*v;
        const uvv = u * v * v;
        nU[i] = Math.max(0, Math.min(1, u + Du * lap_u - uvv + f * (1 - u)));
        nV[i] = Math.max(0, Math.min(1, v + Dv * lap_v + uvv - (f + k) * v));
      }
    }
    [U, nU] = [nU, U];
    [V, nV] = [nV, V];
    gen++;
  }
}

// Color mapping: map V concentration to beautiful palette
function getColor(v) {
  // Deep ink to mist — Orbioom palette
  const t = Math.min(1, v * 2.2);
  if (t < 0.33) {
    // near 0: deep #1a1b22 (background)
    return [18 + t * 3 * 40, 19 + t * 3 * 40, 26 + t * 3 * 36];
  } else if (t < 0.66) {
    // mid: muted blue-gray
    const s = (t - 0.33) * 3;
    return [58 + s * 90, 62 + s * 84, 80 + s * 80];
  } else {
    // high v: near white/glass highlight
    const s = (t - 0.66) * 3;
    return [148 + s * 107, 146 + s * 109, 160 + s * 95];
  }
}

function draw() {
  const imgData = simCtx.createImageData(SIM_W, SIM_H);
  const d = imgData.data;
  for (let i = 0; i < SIM_W * SIM_H; i++) {
    const [r, g, b] = getColor(V[i]);
    d[i*4]   = r;
    d[i*4+1] = g;
    d[i*4+2] = b;
    d[i*4+3] = 255;
  }
  simCtx.putImageData(imgData, 0, 0);

  const dW = display.width, dH = display.height;
  dCtx.imageSmoothingEnabled = false;
  dCtx.drawImage(sim, 0, 0, dW, dH);
}

function loop() {
  if (!running) return;
  step(4);
  draw();
  document.getElementById('genCount').textContent = `gen ${gen}`;
  animId = requestAnimationFrame(loop);
}

function toggleSim() {
  running = !running;
  document.getElementById('toggleBtn').textContent = running ? 'pause' : 'play';
  document.getElementById('liveDot').style.opacity = running ? '1' : '0.3';
  if (running) loop();
}

function resetSim() {
  init();
  if (!running) { running = true; document.getElementById('toggleBtn').textContent = 'pause'; document.getElementById('liveDot').style.opacity = '1'; }
  cancelAnimationFrame(animId);
  loop();
}

function applyPreset(el, name) {
  document.querySelectorAll('.preset-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  const p = PRESETS[name];
  params = { ...p };
  document.getElementById('sliderF').value = p.f;
  document.getElementById('sliderK').value = p.k;
  document.getElementById('sliderDu').value = p.Du;
  document.getElementById('sliderDv').value = p.Dv;
  document.getElementById('valF').textContent = p.f.toFixed(3);
  document.getElementById('valK').textContent = p.k.toFixed(3);
  document.getElementById('valDu').textContent = p.Du.toFixed(2);
  document.getElementById('valDv').textContent = p.Dv.toFixed(2);
  resetSim();
}

function setupSlider(id, valId, key, digits) {
  const slider = document.getElementById(id);
  const val = document.getElementById(valId);
  slider.addEventListener('input', () => {
    const v = parseFloat(slider.value);
    params[key] = v;
    val.textContent = v.toFixed(digits);
    document.querySelectorAll('.preset-chip').forEach(c => c.classList.remove('active'));
  });
}
setupSlider('sliderF', 'valF', 'f', 3);
setupSlider('sliderK', 'valK', 'k', 3);
setupSlider('sliderDu', 'valDu', 'Du', 2);
setupSlider('sliderDv', 'valDv', 'Dv', 2);

// Click to seed more V in simulation coordinates
display.addEventListener('click', e => {
  const rect = display.getBoundingClientRect();
  const sx = Math.floor(((e.clientX - rect.left) / rect.width) * SIM_W);
  const sy = Math.floor(((e.clientY - rect.top) / rect.height) * SIM_H);
  const r = 6;
  for (let dy = -r; dy <= r; dy++) {
    for (let dx = -r; dx <= r; dx++) {
      if (dx*dx + dy*dy <= r*r) {
        const i = idx(sx + dx, sy + dy);
        U[i] = 0.5; V[i] = 0.25;
      }
    }
  }
});

function saveImage() {
  const a = document.createElement('a');
  a.href = display.toDataURL('image/png');
  a.download = `diffusion-${Date.now()}.png`;
  a.click();
}

function resizeDisplay() {
  display.width = window.innerWidth;
  display.height = window.innerHeight - 160;
  draw();
}
window.addEventListener('resize', resizeDisplay);
resizeDisplay();

init();
loop();
</script>
</body>
</html>
