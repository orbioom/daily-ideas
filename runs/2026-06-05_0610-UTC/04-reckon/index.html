<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reckon — quiet invoices</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --glass: rgba(255,255,255,0.42);
    --glass-raised: rgba(255,255,255,0.78);
    --border: rgba(255,255,255,0.7);
    --border-2: rgba(255,255,255,0.95);
    --text: #1b1d2a;
    --text-2: #565a70;
    --text-3: #8b8fa3;
    --accent-grad: linear-gradient(180deg,#3a3e4c 0%,#23262f 100%);
    --dot-live:#86c79a;
    --blur:22px;
    --ease:cubic-bezier(0.16,1,0.3,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:Manrope,system-ui,sans-serif;color:var(--text);
    min-height:100vh;
    background:
      radial-gradient(1100px 700px at 12% -8%, #f3f4f8 0%, transparent 60%),
      radial-gradient(900px 600px at 100% 0%, #e9ebf2 0%, transparent 55%),
      linear-gradient(180deg,#edeef3 0%,#e7e9f0 60%,#eceef2 100%);
    background-attachment:fixed;
    padding:32px 20px 80px;
  }
  .wrap{max-width:1180px;margin:0 auto}
  header.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px}
  .orb{width:30px;height:30px;border-radius:50%;
    background:radial-gradient(circle at 32% 28%,#fff,#c8ccd8 42%,#6c7180 100%);
    box-shadow:inset 0 1px 2px rgba(255,255,255,.8),0 4px 14px rgba(40,44,80,.18)}
  .brand h1{font-size:18px;font-weight:700;letter-spacing:-.01em}
  .brand .mono{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-3);letter-spacing:.04em;text-transform:uppercase}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap}
  button,.btn{font-family:Manrope,sans-serif;font-weight:600;font-size:14px;cursor:pointer;border-radius:12px;border:1px solid var(--border);
    padding:10px 16px;transition:transform .25s var(--ease),box-shadow .25s var(--ease);background:var(--glass);backdrop-filter:blur(var(--blur));color:var(--text)}
  button:hover{transform:translateY(-1px)}
  .btn-ink{background:var(--accent-grad);color:#fff;border:1px solid rgba(0,0,0,.2);box-shadow:0 6px 18px rgba(40,44,80,.22)}
  .grid{display:grid;grid-template-columns:360px 1fr;gap:22px;align-items:start}
  @media(max-width:860px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--glass);backdrop-filter:blur(var(--blur)) saturate(180%);border:1px solid var(--border);border-radius:20px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 14px 40px rgba(40,44,80,.10);padding:22px}
  .panel h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3);font-family:'JetBrains Mono',monospace;margin-bottom:16px;font-weight:500}
  label{display:block;font-size:12px;color:var(--text-2);margin:12px 0 5px;font-weight:600}
  input,textarea,select{width:100%;font-family:Manrope,sans-serif;font-size:14px;color:var(--text);border:1px solid var(--border-2);
    background:rgba(255,255,255,.55);border-radius:10px;padding:9px 11px;transition:border-color .2s var(--ease)}
  input:focus,textarea:focus{outline:none;border-color:#aab0c4;background:rgba(255,255,255,.8)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  /* invoice preview */
  .doc{background:var(--glass-raised);backdrop-filter:blur(30px);border:1px solid var(--border-2);border-radius:20px;
    box-shadow:0 18px 50px rgba(40,44,80,.14);padding:40px 44px;min-height:600px}
  .doc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;border-bottom:1px solid rgba(40,44,80,.12);padding-bottom:22px}
  .doc-head .word{font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-3)}
  .doc-head h3{font-size:30px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
  .meta{font-size:13px;color:var(--text-2);text-align:right;line-height:1.7}
  .meta b{color:var(--text)}
  .parties{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin:24px 0}
  .parties .lab{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3);margin-bottom:6px;font-family:'JetBrains Mono',monospace}
  .parties .body{font-size:14px;color:var(--text);line-height:1.6;white-space:pre-line}
  table{width:100%;border-collapse:collapse;margin-top:8px}
  thead th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);text-align:left;padding:10px 8px;border-bottom:1px solid rgba(40,44,80,.14);font-family:'JetBrains Mono',monospace;font-weight:500}
  thead th.num,tbody td.num{text-align:right}
  tbody td{padding:11px 8px;font-size:14px;border-bottom:1px solid rgba(40,44,80,.07);color:var(--text)}
  tbody td input{border:none;background:transparent;padding:4px 2px;font-size:14px}
  tbody td input:focus{background:rgba(255,255,255,.7);border-radius:6px}
  .del{color:var(--text-3);cursor:pointer;font-size:16px;border:none;background:none;padding:2px 6px}
  .del:hover{color:#c1788a}
  .totals{margin-top:18px;margin-left:auto;width:280px;font-size:14px}
  .totals .line{display:flex;justify-content:space-between;padding:7px 0;color:var(--text-2)}
  .totals .grand{display:flex;justify-content:space-between;padding:13px 0 0;margin-top:6px;border-top:1px solid rgba(40,44,80,.16);font-size:20px;font-weight:700;color:var(--text)}
  .notes{margin-top:30px;font-size:13px;color:var(--text-2);line-height:1.7;white-space:pre-line}
  .addrow{margin-top:12px}
  .hint{font-size:11px;color:var(--text-3);margin-top:14px;line-height:1.6;font-family:'JetBrains Mono',monospace}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--dot-live);box-shadow:0 0 0 3px rgba(134,199,154,.22);margin-right:7px;vertical-align:middle}
  @media print{
    body{background:#fff;padding:0}
    .panel,.toolbar,.brand .mono,.addrow,.hint,.del{display:none!important}
    .grid{grid-template-columns:1fr;gap:0}
    .doc{box-shadow:none;border:none;border-radius:0;backdrop-filter:none;background:#fff;padding:0}
    tbody td input{color:#000}
    header.top{margin-bottom:0}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="orb"></div>
      <div>
        <h1>Reckon</h1>
        <div class="mono">quiet invoices · saved on this device</div>
      </div>
    </div>
    <div class="toolbar">
      <button id="addItem">+ Line item</button>
      <button id="newInv">New</button>
      <button class="btn-ink" id="print">Download PDF</button>
    </div>
  </header>

  <div class="grid">
    <!-- editor -->
    <section class="panel">
      <h2>Details</h2>
      <label>Your name / studio</label>
      <input id="fromName" placeholder="Orbioom Studio" />
      <label>Your address & contact</label>
      <textarea id="fromAddr" rows="3" placeholder="hello@orbioom.com&#10;123 Mist Lane&#10;London, UK"></textarea>

      <label>Bill to</label>
      <input id="toName" placeholder="Client Inc." />
      <label>Client address</label>
      <textarea id="toAddr" rows="3" placeholder="accounts@client.com&#10;..."></textarea>

      <div class="row2">
        <div><label>Invoice #</label><input id="invNo" placeholder="0001" /></div>
        <div><label>Currency</label>
          <select id="cur">
            <option>$</option><option>£</option><option>€</option><option>¥</option>
          </select>
        </div>
      </div>
      <div class="row2">
        <div><label>Issued</label><input id="issued" type="date" /></div>
        <div><label>Due</label><input id="due" type="date" /></div>
      </div>
      <div class="row2">
        <div><label>Tax %</label><input id="tax" type="number" value="0" min="0" step="0.1" /></div>
        <div><label>Discount</label><input id="disc" type="number" value="0" min="0" step="0.01" /></div>
      </div>
      <label>Notes / payment terms</label>
      <textarea id="notes" rows="3" placeholder="Payment within 14 days. Bank: ..."></textarea>
      <p class="hint"><span class="dot"></span>Everything stays in your browser. Nothing is uploaded.</p>
    </section>

    <!-- preview / printable doc -->
    <section class="doc" id="doc">
      <div class="doc-head">
        <div>
          <div class="word">Invoice</div>
          <h3 id="pFromName">Your Studio</h3>
          <div class="parties" style="margin:0;display:block">
            <div class="body" id="pFromAddr" style="font-size:13px;color:var(--text-2)"></div>
          </div>
        </div>
        <div class="meta">
          <div>Invoice <b id="pInvNo">#0001</b></div>
          <div>Issued <b id="pIssued">—</b></div>
          <div>Due <b id="pDue">—</b></div>
        </div>
      </div>

      <div class="parties">
        <div>
          <div class="lab">Billed to</div>
          <div class="body" id="pToName">Client</div>
          <div class="body" id="pToAddr" style="color:var(--text-2);font-size:13px"></div>
        </div>
      </div>

      <table>
        <thead><tr><th>Description</th><th class="num">Qty</th><th class="num">Rate</th><th class="num">Amount</th><th></th></tr></thead>
        <tbody id="items"></tbody>
      </table>
      <button class="addrow" id="addItem2">+ Add line item</button>

      <div class="totals">
        <div class="line"><span>Subtotal</span><span id="pSub">$0.00</span></div>
        <div class="line" id="pTaxLine"><span>Tax</span><span id="pTax">$0.00</span></div>
        <div class="line" id="pDiscLine"><span>Discount</span><span id="pDisc">$0.00</span></div>
        <div class="grand"><span>Total</span><span id="pTotal">$0.00</span></div>
      </div>

      <div class="notes" id="pNotes"></div>
    </section>
  </div>
</div>

<script>
const KEY="reckon.invoice.v1";
const $=id=>document.getElementById(id);
const fields=["fromName","fromAddr","toName","toAddr","invNo","cur","issued","due","tax","disc","notes"];
let items=[];

function fmt(n){const c=$("cur").value;return c+ (Math.round(n*100)/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});}

function renderItems(){
  const tb=$("items");tb.innerHTML="";
  items.forEach((it,i)=>{
    const amt=(parseFloat(it.qty)||0)*(parseFloat(it.rate)||0);
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td><input data-i="${i}" data-k="desc" value="${esc(it.desc)}" placeholder="Design work, week 1"></td>
      <td class="num"><input data-i="${i}" data-k="qty" value="${esc(it.qty)}" style="text-align:right" type="number" step="0.25"></td>
      <td class="num"><input data-i="${i}" data-k="rate" value="${esc(it.rate)}" style="text-align:right" type="number" step="0.01"></td>
      <td class="num">${fmt(amt)}</td>
      <td><button class="del" data-del="${i}">×</button></td>`;
    tb.appendChild(tr);
  });
  computeTotals();
}
function esc(s){return String(s==null?"":s).replace(/"/g,"&quot;");}

function computeTotals(){
  let sub=items.reduce((a,it)=>a+(parseFloat(it.qty)||0)*(parseFloat(it.rate)||0),0);
  const taxPct=parseFloat($("tax").value)||0;
  const disc=parseFloat($("disc").value)||0;
  const tax=sub*taxPct/100;
  const total=Math.max(0,sub+tax-disc);
  $("pSub").textContent=fmt(sub);
  $("pTax").textContent=fmt(tax);
  $("pDisc").textContent="−"+fmt(disc);
  $("pTotal").textContent=fmt(total);
  $("pTaxLine").style.display=taxPct?"flex":"none";
  $("pDiscLine").style.display=disc?"flex":"none";
}

function mirror(){
  $("pFromName").textContent=$("fromName").value||"Your Studio";
  $("pFromAddr").textContent=$("fromAddr").value;
  $("pToName").textContent=$("toName").value||"Client";
  $("pToAddr").textContent=$("toAddr").value;
  $("pInvNo").textContent="#"+($("invNo").value||"0001");
  $("pIssued").textContent=$("issued").value||"—";
  $("pDue").textContent=$("due").value||"—";
  $("pNotes").textContent=$("notes").value;
  renderItems();
}

function save(){
  const data={items};
  fields.forEach(f=>data[f]=$(f).value);
  localStorage.setItem(KEY,JSON.stringify(data));
}
function load(){
  const raw=localStorage.getItem(KEY);
  if(raw){const d=JSON.parse(raw);fields.forEach(f=>{if(d[f]!=null)$(f).value=d[f];});items=d.items||[];}
  if(!items.length)items=[{desc:"Design & build",qty:"1",rate:"1200"}];
  if(!$("invNo").value)$("invNo").value="0001";
  if(!$("issued").value)$("issued").value=new Date().toISOString().slice(0,10);
}

document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.i!=null){items[+t.dataset.i][t.dataset.k]=t.value;computeTotals();save();return;}
  if(fields.includes(t.id)){mirror();save();}
});
document.addEventListener("click",e=>{
  if(e.target.dataset.del!=null){items.splice(+e.target.dataset.del,1);renderItems();save();}
});
$("addItem").onclick=$("addItem2").onclick=()=>{items.push({desc:"",qty:"1",rate:"0"});renderItems();save();};
$("newInv").onclick=()=>{if(confirm("Start a fresh invoice? Current one is cleared from this device."))
  {localStorage.removeItem(KEY);items=[];fields.forEach(f=>{if(f!=="cur")$(f).value="";});load();mirror();}};
$("print").onclick=()=>window.print();

load();mirror();
</script>
</body>
</html>
