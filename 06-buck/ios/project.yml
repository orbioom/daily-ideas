name: Buck
options:
  bundleIdPrefix: com.orbioom
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.orbioom.buck
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  Buck:
    type: application
    platform: iOS
    sources:
      - path: Buck
    info:
      path: Buck/Info.plist
      properties:
        CFBundleDisplayName: Buck
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Buck/Info.plist
    dependencies: []
